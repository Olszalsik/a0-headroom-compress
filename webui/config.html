<!DOCTYPE html>
<html>
<head>
  <title>Headroom Context Compression - Settings</title>
  <script type="module" src="/components/plugins/plugin-settings-store.js"></script>
  <script type="module" src="/plugins/headroom_compress/webui/headroom-store.js"></script>
  <style>
    .headroom-section {
      padding: 8px 4px 16px 4px;
    }
    .headroom-section h3 {
      margin: 0 0 8px 0;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .headroom-grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 10px 16px;
      align-items: center;
    }
    .headroom-grid label {
      font-size: 13px;
      opacity: 0.85;
    }
    .headroom-grid input[type="text"],
    .headroom-grid input[type="number"],
    .headroom-grid select {
      width: 100%;
      max-width: 320px;
      padding: 4px 6px;
      background: var(--color-surface, #1f1f23);
      color: var(--color-text, #eee);
      border: 1px solid var(--color-border, #333);
      border-radius: 4px;
    }
    .headroom-help {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 2px;
    }
    .headroom-actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .headroom-actions button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--color-border, #333);
      background: var(--color-accent, #2a5adf);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .headroom-actions button.secondary {
      background: transparent;
      color: var(--color-text, #eee);
    }
    .headroom-actions button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .headroom-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--color-surface, #1f1f23);
      border: 1px solid var(--color-border, #333);
      font-size: 11px;
      opacity: 0.85;
    }
    .headroom-pill.on { color: #7ed957; }
    .headroom-pill.off { color: #e26d6d; }
    .headroom-banner {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      background: rgba(255, 200, 80, 0.1);
      border: 1px solid rgba(255, 200, 80, 0.3);
      margin: 8px 0 12px 0;
    }
  </style>
</head>
<body>
  <template x-if="$store.headroomStore">
    <div
        x-init="$store.headroomStore.onOpen()"
        x-destroy="$store.headroomStore.cleanup()"
        class="headroot-host"
      >
        <div class="headroom-section">
          <h3>Status</h3>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <span class="headroom-pill" :class="$store.headroomStore.toggleClass" x-text="$store.headroomStore.toggleLabel"></span>
            <span class="headroom-pill" x-text="'scope: ' + ($store.headroomStore.scope || 'global')"></span>
            <span class="headroom-pill" x-text="'mode: ' + (config.mode || 'safe') + ' | level: ' + (config.level || 'balanced')"></span>
            <span class="headroom-pill" x-text="'ccr: ' + (config.ccr_enabled ? 'on' : 'off')"></span>
          </div>
          <div class="headroom-banner" x-show="!$store.headroomStore.headroomAvailable" x-cloak>
            <strong>headroom-ai package not detected.</strong>
            Click <em>Install headroom-ai</em> below. Until it is installed the plugin
            is a no-op (no error, just no compression).
          </div>
        </div>

        <div class="headroom-section">
          <h3>Master switch</h3>
          <div class="headroom-grid">
            <label for="hr-enabled">Enable plugin</label>
            <div>
              <input type="checkbox" id="hr-enabled" x-model="config.enabled" />
              <div class="headroom-help">
                When off the plugin is a true no-op: the LLM tools still register
                but the compressor returns the input unchanged. The global Agent
                Zero toggle (Plugins UI) is a separate, stronger switch.
              </div>
            </div>

            <label for="hr-mode">Mode</label>
            <div>
              <select id="hr-mode" x-model="config.mode">
                <option value="safe">safe (local deterministic; no headroom-ai import)</option>
                <option value="normal">normal (headroom-ai full feature path)</option>
              </select>
              <div class="headroom-help">Safe mode never calls headroom-ai, an LLM, or the network. Normal mode uses the current headroom-ai implementation.</div>
            </div>

            <label for="hr-strategy">Strategy</label>
            <div>
              <select id="hr-strategy" x-model="config.strategy">
                <option value="auto">auto (let headroom-ai pick per content type)</option>
                <option value="smart_crusher">smart_crusher (universal JSON)</option>
                <option value="code">code (AST-aware; needs [code] extra)</option>
                <option value="kompress">kompress (HuggingFace model; needs [ml] extra)</option>
              </select>
            </div>

            <label for="hr-level">Compression level</label>
            <div>
              <select id="hr-level" x-model="config.level">
                <option value="safe">safe (no lossy transforms)</option>
                <option value="balanced">balanced (default)</option>
                <option value="aggressive">aggressive (max savings)</option>
              </select>
            </div>

            <label for="hr-model">Model hint</label>
            <div>
              <input type="text" id="hr-model" x-model="config.model_hint"
                placeholder="gpt-4o, claude-3-5-sonnet, ..." />
              <div class="headroom-help">
                Used by headroom-ai to pick the right tokenizer. Match this to the
                chat model Agent Zero is configured to use.
              </div>
            </div>
          </div>
        </div>

        <div class="headroom-section">
          <h3>Automatic compression</h3>
          <div class="headroom-grid">
            <label for="hr-auto-tool">Auto-compress tool outputs</label>
            <div>
              <input type="checkbox" id="hr-auto-tool"
                :checked="config.auto_compress_tool_outputs_min_tokens > 0"
                @change="config.auto_compress_tool_outputs_min_tokens = $event.target.checked ? 200 : 0" />
              <div class="headroom-help">
                Compress tool outputs that exceed the threshold below. The LLM
                still gets the compressed content + a CCR key it can call
                <code>headroom_retrieve</code> on for the original.
              </div>
            </div>

            <label for="hr-thresh">Min tokens to compress</label>
            <div>
              <input type="number" id="hr-thresh" min="0" step="50"
                x-model.number="config.auto_compress_tool_outputs_min_tokens" />
              <div class="headroom-help">0 disables auto-compression; default 200 tokens.</div>
            </div>

            <label for="hr-auto-hist">Auto-compress long history</label>
            <div>
              <input type="checkbox" id="hr-auto-hist" x-model="config.auto_compress_history" />
            </div>

            <label for="hr-hist-thresh">History threshold</label>
            <div>
              <input type="number" id="hr-hist-thresh" min="0" step="500"
                x-model.number="config.auto_compress_history_min_tokens" />
            </div>

            <label for="hr-expose-tool">Expose compress_text tool</label>
            <div>
              <input type="checkbox" id="hr-expose-tool" x-model="config.expose_compress_tool" />
              <div class="headroom-help">
                Even with auto-compression off, the LLM can call
                <code>compress_text</code> on demand to shrink a specific string.
              </div>
            </div>

            <label for="hr-verbose">Verbose logging</label>
            <div>
              <input type="checkbox" id="hr-verbose" x-model="config.verbose" />
            </div>
          </div>
        </div>

        <div class="headroom-section">
          <h3>CCR (reversible) cache</h3>
          <div class="headroom-grid">
            <label for="hr-ccr-on">Enable CCR</label>
            <div>
              <input type="checkbox" id="hr-ccr-on" x-model="config.ccr_enabled" />
              <div class="headroom-help">
                Store full originals locally so the LLM can pull them back on
                demand. Disable for a fully lossy / lighter footprint.
              </div>
            </div>

            <label for="hr-ccr-back">Backend</label>
            <div>
              <select id="hr-ccr-back" x-model="config.ccr_backend">
                <option value="sqlite">sqlite (recommended, in plugin dir)</option>
                <option value="in_memory">in_memory (lost on restart)</option>
                <option value="redis">redis (requires redis-py)</option>
              </select>
            </div>

            <label for="hr-ccr-path">Custom CCR path</label>
            <div>
              <input type="text" id="hr-ccr-path" x-model="config.ccr_path"
                placeholder="(default: <plugin>/ccr/ccr.db)" />
            </div>

            <label for="hr-ccr-ttl">TTL (days)</label>
            <div>
              <input type="number" id="hr-ccr-ttl" min="0" step="1"
                x-model.number="config.ccr_ttl_days" />
              <div class="headroom-help">0 = keep forever.</div>
            </div>
          </div>
        </div>

        <div class="headroom-section">
          <h3>Stats</h3>
          <div class="headroom-grid">
            <label for="hr-stats-on">Record stats</label>
            <div>
              <input type="checkbox" id="hr-stats-on" x-model="config.stats_enabled" />
            </div>
            <label for="hr-stats-path">Custom stats path</label>
            <div>
              <input type="text" id="hr-stats-path" x-model="config.stats_path"
                placeholder="(default: <plugin>/stats/stats.db)" />
            </div>
          </div>
        </div>

        <div class="headroom-section">
          <h3>Proxy mode <span style="font-weight:normal;opacity:0.6;">(transparent compression for every LLM call)</span></h3>
          <div class="headroom-grid" x-init="$store.headroomStore.refreshProxyStatus()">
            <label>Status</label>
            <div>
              <span x-show="!$store.headroomStore.proxyStatus">Checking ...</span>
              <span x-show="$store.headroomStore.proxyStatus && $store.headroomStore.proxyStatus.running"
                    style="color:#6dd06d;font-weight:600;">
                Running on http://127.0.0.1:<span x-text="$store.headroomStore.proxyStatus?.port || 8787"></span>
                (pid <span x-text="$store.headroomStore.proxyStatus?.pid"></span>)
              </span>
              <span x-show="$store.headroomStore.proxyStatus && !$store.headroomStore.proxyStatus.running"
                    style="color:#d08a6d;">
                Stopped
                <span x-show="$store.headroomStore.proxyStatus?.error"
                      x-text="' - ' + $store.headroomStore.proxyStatus.error"></span>
              </span>
            </div>

            <label for="hr-proxy-auto">Auto-start on plugin load</label>
            <div>
              <input type="checkbox" id="hr-proxy-auto"
                x-model="config.proxy.auto_start" />
              <div class="headroom-help">
                When ON, the proxy starts automatically whenever the plugin is
                enabled. Off by default - start it manually with the button below.
              </div>
            </div>

            <label for="hr-proxy-host">Bind host</label>
            <div>
              <input type="text" id="hr-proxy-host" x-model="config.proxy.host" />
              <div class="headroom-help">Localhost only - do not expose externally.</div>
            </div>

            <label for="hr-proxy-port">Bind port</label>
            <div>
              <input type="number" id="hr-proxy-port" min="1" max="65535"
                x-model.number="config.proxy.port" />
            </div>

            <label for="hr-proxy-mode">Optimization mode</label>
            <div>
              <select id="hr-proxy-mode" x-model="config.proxy.mode">
                <option value="token">token - max savings, rewrites prior turns</option>
                <option value="cache">cache - max prefix-cache hit rate</option>
              </select>
            </div>

            <label>Usage</label>
            <div class="headroom-help" style="line-height:1.5;">
              After the proxy is running, open <strong>Settings &rarr; Model</strong>
              and set the active provider's <code>api_base</code> to
              <code>http://127.0.0.1:<span x-text="$store.headroomStore.proxyStatus?.port || config.proxy.port || 8787"></span></code>.
              The headroom binary lives at
              <code x-text="config.proxy.binary || '/opt/venv-a0/bin/headroom'"></code>.
            </div>
          </div>
        </div>

        <div class="headroom-actions">
          <button type="button" @click="$store.headroomStore.installPackage()"
            :disabled="$store.headroomStore.busy">
            <span x-show="!$store.headroomStore.busy">Install / upgrade headroom-ai</span>
            <span x-show="$store.headroomStore.busy" x-cloak>Working ...</span>
          </button>
          <button type="button" class="secondary"
            @click="$store.headroomStore.openDashboard()">
            Open stats dashboard
          </button>
          <button type="button" class="secondary"
            @click="$store.headroomStore.testCompress()">
            Test compress (sample text)
          </button>
          <button type="button" class="primary"
            @click="$store.headroomStore.startProxy()"
            :disabled="$store.headroomStore.proxyBusy || ($store.headroomStore.proxyStatus && $store.headroomStore.proxyStatus.running)">
            <span x-show="!$store.headroomStore.proxyBusy">Start proxy</span>
            <span x-show="$store.headroomStore.proxyBusy" x-cloak>Working ...</span>
          </button>
          <button type="button" class="secondary"
            @click="$store.headroomStore.stopProxy()"
            :disabled="$store.headroomStore.proxyBusy || !($store.headroomStore.proxyStatus && $store.headroomStore.proxyStatus.running)">
            Stop proxy
          </button>
          <button type="button" class="secondary"
            @click="$store.headroomStore.restartProxy()"
            :disabled="$store.headroomStore.proxyBusy">
            Restart proxy
          </button>
        </div>
      </div>
    </template>
</body>
</html>
