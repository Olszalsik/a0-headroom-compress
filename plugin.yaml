name: headroom_compress
title: Headroom Context Compression
description: >
  Toggleable context compression for Agent Zero. Wraps the headroom-ai library to
  shrink tool outputs, logs, RAG chunks, and chat history by 60-95% before they
  reach the LLM. Originals are kept in a local CCR cache and can be retrieved
  on demand. ON/OFF globally, per-project, and per-agent profile.
version: 0.4.0
# v2.2 of Agent Zero added the hist_add_before extension point and the
# banners extension point. Both are wired up by this plugin.
min_framework_version: 2.2.0
settings_sections:
  - agent
  - developer
per_project_config: true
per_agent_config: true
always_enabled: false
# Discoverable as a Welcome Screen feature card and (when headroom-ai is
# missing) as a setup-hint warning banner. See
# extensions/python/banners/_10_headroom_compress.py.
discovery:
  banner: true
  feature_card: true
